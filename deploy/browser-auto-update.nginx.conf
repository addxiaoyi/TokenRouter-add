# browser-auto-update.nginx.conf serves the watcher and an uncached build probe.
# Include it inside the HTTPS server and install the script at the alias path.
# The probe reads the running backend's document, so it follows deployed assets
# without treating an undeployed GitHub commit as a browser update.
location = /_client-update/browser-auto-update.js {
    alias /var/www/tokenrouter/browser-auto-update.js;
    default_type application/javascript;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
}

location = /_client-update/version {
    proxy_pass http://127.0.0.1:3202/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    proxy_hide_header Cache-Control;
    proxy_hide_header ETag;
    proxy_hide_header Last-Modified;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store, max-age=0" always;
}
