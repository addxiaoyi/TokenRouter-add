# browser-auto-update-filter.nginx.conf injects the watcher only into application
# documents containing the SPA mount point. Include it inside the existing root
# proxy location; default sub_filter MIME handling leaves API JSON and SSE alone.
# Keep the watcher parser-blocking so its baseline precedes module initialization;
# otherwise stylesheets added by route imports could be mistaken for deployed assets.
proxy_set_header Accept-Encoding "";
sub_filter_once on;
sub_filter '<div id="app"></div>' '<div id="app"></div><script src="/_client-update/browser-auto-update.js"></script>';
